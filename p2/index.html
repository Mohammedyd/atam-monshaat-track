<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العلامات التجارية والامتياز التجاري في قطاع الرياضة · أتام</title>
<link rel="stylesheet" href="../assets/player.css">
</head>
<body>
<div id="app">
  <aside id="side" aria-label="محتويات البرنامج">
    <div class="side-head">
      <img src="../assets/img/atam-wordmark-white.png" alt="atam">
      <div class="eyebrow" id="sideNum"></div>
      <div class="side-title" id="sideTitle"></div>
      <div class="progress" aria-hidden="true"><i></i></div>
      <div class="progress-label"><span id="progDesc"></span><span id="progTxt"></span></div>
    </div>
    <ol id="toc"></ol>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <div class="topbar">
      <button type="button" class="btn" id="menuBtn" aria-label="فتح المحتويات">المحتويات</button>
      <span class="crumb" id="crumb"></span>
      <button type="button" class="btn" id="tocBtn">صفحة البداية</button>
    </div>
    <div id="view" aria-live="polite"></div>
    <footer class="foot">
      <span>© 2026 شركة أتام محامون ومستشارون · جميع الحقوق محفوظة</span>
      <span>المحتوى توعوي ولا يُعد استشارة قانونية لحالة بعينها</span>
    </footer>
  </main>
</div>
<script src="../assets/preview-lms.js"></script>
<script src="../assets/scorm12.js"></script>
<script src="course.js"></script>
<script src="../assets/player.js"></script>
</body>
</html>
